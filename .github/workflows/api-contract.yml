name: API contract

# Early warning for upstream changes.
#
# Asked for every hour, at a minute nobody else picks. GitHub runs scheduled
# workflows when it has room, so the real gap has been a few hours; the top of
# the hour was worse, with eleven-hour holes. The shape check in light mode
# reads the live payloads and compares every field against
# scripts/api-shape.json, so a field appearing, vanishing or changing type is
# caught before it breaks anything. About 4.6 MB a run.
#
# Once a day: the same check over everything, plus the contract check, which
# asserts the handful of things the app cannot work without.
#
# Drift opens an issue, assigned, and leaves the run green: the issue is the
# notification and one an hour by email is not. Only the checks falling over
# fail the run.

on:
  schedule:
    - cron: '23 * * * *'
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Check everything, not just the light probes
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      FULL: ${{ github.event.schedule == '23 6 * * *' || inputs.full || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the shape of every payload
        id: shape
        shell: bash
        run: |
          set -o pipefail
          echo "full run: $FULL"
          if [ "$FULL" = "true" ]; then
            node scripts/api-shape.mjs 2>&1 | tee shape.log || code=$?
          else
            node scripts/api-shape.mjs --light 2>&1 | tee shape.log || code=$?
          fi
          code=${code:-0}
          if [ "$code" = "2" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Check the contract the app relies on
        id: contract
        if: env.FULL == 'true' && always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/api-contract-check.mjs 2>&1 | tee contract.log || code=$?
          code=${code:-0}
          if [ "$code" = "2" ]; then
            echo "broke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Say what moved
        if: steps.shape.outputs.moved == 'true' || steps.contract.outputs.broke == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'api-drift';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const read = name => {
              try { return fs.readFileSync(name, 'utf8').trim(); } catch { return ''; }
            };

            const after = (text, marker) => text.includes(marker)
              ? '```\n' + text.split(marker)[1].trim() + '\n```'
              : '';

            const moved = '${{ steps.shape.outputs.moved }}' === 'true';
            const broke = '${{ steps.contract.outputs.broke }}' === 'true';

            const body = [
              broke
                ? 'A check the app cannot work without has failed.'
                : 'Nothing is broken yet. A payload stopped looking the way it was recorded.',
              '',
              moved ? after(read('shape.log'), 'WHAT CHANGED:') : '',
              broke ? after(read('contract.log'), 'FAILURES:') : '',
              '',
              `Run: ${runUrl}`,
              '',
              moved ? 'Once the app handles the new shape, `npm run record:api` writes it back.' : '',
            ].filter(Boolean).join('\n');

            const title = broke
              ? 'The Carris API broke something the app relies on'
              : 'The Carris API changed shape';

            const detail = [moved ? read('shape.log') : '', broke ? read('contract.log') : '']
              .join('\n')
              .split('\n')
              .filter(line => /^\s{2}(gone|new|retyped|silent|unwatched|✗)/.test(line))
              .map(line => line.trim())
              .sort()
              .join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            const already = open.find(issue => issue.title === title);

            if (!already) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                assignees: ['KennedySilva8907'],
                body,
              });

              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: already.number,
              per_page: 100,
            });

            const written = [already.body ?? '', ...comments.map(comment => comment.body ?? '')].join('\n');
            const isNew = detail.length > 0 && !detail.split('\n').every(line => written.includes(line));
            const quiet = Date.now() - new Date(already.updated_at).getTime() > 20 * 60 * 60 * 1000;

            if (!isNew && !quiet) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: already.number,
              body: `${isNew ? 'Something else now.' : 'Still happening.'}\n\n${body}`,
            });

