name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/buslisbon-api:${{ github.sha }}
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --target runtime -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push the alert job image
        run: |
          JOB_IMAGE=ghcr.io/${{ github.repository_owner }}/buslisbon-alertjob:${{ github.sha }}
          JOB_IMAGE=$(echo "$JOB_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --target job -t "$JOB_IMAGE" backend
          docker push "$JOB_IMAGE"
          echo "JOB_IMAGE=$JOB_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push the collection job image
        run: |
          COLLECTOR_IMAGE=ghcr.io/${{ github.repository_owner }}/buslisbon-collectionjob:${{ github.sha }}
          COLLECTOR_IMAGE=$(echo "$COLLECTOR_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --target collector -t "$COLLECTOR_IMAGE" backend
          docker push "$COLLECTOR_IMAGE"
          echo "COLLECTOR_IMAGE=$COLLECTOR_IMAGE" >> "$GITHUB_ENV"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        run: |
          az containerapp update \
            --name ca-buslisbon-api \
            --resource-group rg-buslisbon \
            --image "$IMAGE" \
            --set-env-vars ASPNETCORE_URLS=http://+:8080

          az containerapp ingress update \
            --name ca-buslisbon-api \
            --resource-group rg-buslisbon \
            --target-port 8080

      - name: Roll out the alert job image
        run: |
          if az containerapp job show --name cj-buslisbon-alerts --resource-group rg-buslisbon >/dev/null 2>&1; then
            az containerapp job update               --name cj-buslisbon-alerts               --resource-group rg-buslisbon               --image "$JOB_IMAGE"
          else
            echo "The alert job has not been created yet, leaving the image in the registry"
          fi

      - name: Roll out the collection job image
        run: |
          if az containerapp job show --name cj-buslisbon-collection --resource-group rg-buslisbon >/dev/null 2>&1; then
            az containerapp job update --name cj-buslisbon-collection --resource-group rg-buslisbon --image "$COLLECTOR_IMAGE"
          else
            echo "The collection job has not been created yet, leaving the image in the registry"
          fi

      - name: Smoke test the deployed API
        run: |
          FQDN=$(az containerapp show \
            --name ca-buslisbon-api \
            --resource-group rg-buslisbon \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "Testing https://$FQDN"

          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -fsS --max-time 30 "https://$FQDN/health" || true)

            if echo "$BODY" | grep -q '"status":"healthy"'; then
              echo "Health attempt $attempt returned: $BODY"
              break
            fi

            echo "Health attempt $attempt returned: ${BODY:-<empty>}"

            if [ "$attempt" = 6 ]; then
              echo "The health endpoint never returned the expected body"
              exit 1
            fi

            sleep 10
          done

          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -fsS --max-time 60 "https://$FQDN/api/vehicles/status" || true)
            COUNT=$(echo "$BODY" | grep -oE '"liveVehicles":[0-9]+' | grep -oE '[0-9]+$' || true)

            if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
              echo "Gateway attempt $attempt: $COUNT live vehicles"
              exit 0
            fi

            echo "Gateway attempt $attempt returned: ${BODY:-<empty>}"

            if [ "$attempt" = 6 ]; then
              echo "The gateway never reported a live fleet"
              exit 1
            fi

            sleep 10
          done
